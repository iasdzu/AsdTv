      - name: Bundle players for offline use
        run: |
          curl -fsSL https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js -o web/hls.min.js || true
          curl -fsSL https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.js -o web/mpegts.js || true
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build app (unsigned)
        run: |
          xcodebuild -project AsdTv.xcodeproj -target AsdTv -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/AsdTv.app Payload/
          zip -qry AsdTv.ipa Payload
          ls -la AsdTv.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: AsdTv-iPhone
          path: AsdTv.ipa
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: iphone
          name: AsdTv iPhone
          files: AsdTv.ipa
          make_latest: false
