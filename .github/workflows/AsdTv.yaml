      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Bundle hls.js for offline playback
        run: |
          curl -fsSL https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js -o app/src/main/assets/hls.min.js || true
          curl -fsSL https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.js -o app/src/main/assets/mpegts.js || true
          mkdir -p app/src/main/assets/fonts && cd app/src/main/assets/fonts
          curl -fsSL https://cdn.jsdelivr.net/npm/@fontsource-variable/cairo@5/files/cairo-arabic-wght-normal.woff2 -o cairo-arabic.woff2 || curl -fsSL https://cdn.jsdelivr.net/npm/@fontsource/cairo@5/files/cairo-arabic-700-normal.woff2 -o cairo-arabic.woff2 || true
          curl -fsSL https://cdn.jsdelivr.net/npm/@fontsource-variable/cairo@5/files/cairo-latin-wght-normal.woff2 -o cairo-latin.woff2 || curl -fsSL https://cdn.jsdelivr.net/npm/@fontsource/cairo@5/files/cairo-latin-700-normal.woff2 -o cairo-latin.woff2 || true
          for wt in 400 500 700; do
            curl -fsSL https://cdn.jsdelivr.net/npm/@fontsource/tajawal@5/files/tajawal-arabic-$wt-normal.woff2 -o tajawal-$wt-arabic.woff2 || true
            curl -fsSL https://cdn.jsdelivr.net/npm/@fontsource/tajawal@5/files/tajawal-latin-$wt-normal.woff2 -o tajawal-$wt-latin.woff2 || true
          done
          ls -la
      - name: Build APK
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk AsdTv.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AsdTv
          path: AsdTv.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: AsdTv ${{ github.run_number }}
          files: AsdTv.apk
          make_latest: true
